plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "org.jetbrains.kotlin.plugin.compose"
    id "com.google.devtools.ksp"
    id "com.google.gms.google-services"
    id "org.jetbrains.kotlin.plugin.serialization" version "2.1.0"
}

// ------------------------------------------------------------------
// 本地敏感配置：豆包（火山引擎）API Key / 模型终端 ID / 基础地址
// 从【环境变量】或【用户级 ~/.gradle/gradle.properties】读取并注入 BuildConfig，
// 源码与版本库中不保存任何真实值。Key 与终端 ID 未配置时为空字符串（构建可通过，
// 运行时 AI 试衣会返回"未配置"提示，见 AIRepository / APIConfig）；
// 基础地址未配置时回落到默认的火山引擎北京区 Ark 网关（公共信息，非密钥）。
// 配置方式详见 README.zh-CN.md「配置说明」。
// ------------------------------------------------------------------
def doubaoApiKey = System.getenv("DOUBAO_API_KEY") ?: project.findProperty("DOUBAO_API_KEY") ?: ""
def doubaoModelEndpoint = System.getenv("DOUBAO_MODEL_ENDPOINT") ?: project.findProperty("DOUBAO_MODEL_ENDPOINT") ?: ""
def doubaoBaseUrl = System.getenv("DOUBAO_BASE_URL") ?: project.findProperty("DOUBAO_BASE_URL") ?: ""
if (!doubaoBaseUrl) doubaoBaseUrl = "https://ark.cn-beijing.volces.com/api/v3/"

android {
    namespace "com.comp7506.mywardrobe"
    compileSdk 36

    defaultConfig {
        applicationId "com.comp7506.mywardrobe"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }

        // 构建期注入的敏感配置（值来自本地环境变量，源码中无真实密钥）
        buildConfigField "String", "DOUBAO_API_KEY", "\"${doubaoApiKey}\""
        buildConfigField "String", "DOUBAO_MODEL_ENDPOINT", "\"${doubaoModelEndpoint}\""
        buildConfigField "String", "DOUBAO_BASE_URL", "\"${doubaoBaseUrl}\""
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    composeOptions {
        kotlinCompilerExtensionVersion "1.5.15"
    }

    packaging {
        resources {
            excludes += "/META-INF/{AL2.0,LGPL2.1}"
        }
    }
}

dependencies {
    implementation platform("com.google.firebase:firebase-bom:34.11.0")
    implementation "com.google.firebase:firebase-auth"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.9.0"
    implementation "com.google.android.gms:play-services-location:21.3.0"

    def composeBom = platform("androidx.compose:compose-bom:2024.12.01")
    implementation composeBom
    androidTestImplementation composeBom

    implementation "androidx.core:core-ktx:1.15.0"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.8.7"
    implementation "androidx.activity:activity-compose:1.9.3"

    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.ui:ui-text-google-fonts"
    implementation "androidx.compose.ui:ui-tooling-preview"
    debugImplementation "androidx.compose.ui:ui-tooling"
    implementation "androidx.compose.animation:animation"
    implementation "androidx.compose.material3:material3:1.3.1"
    implementation "androidx.compose.material:material-icons-extended"
    implementation "com.google.android.material:material:1.12.0"

    implementation "androidx.navigation:navigation-compose:2.8.5"
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7"

    implementation "androidx.room:room-runtime:2.6.1"
    implementation "androidx.room:room-ktx:2.6.1"
    ksp "androidx.room:room-compiler:2.6.1"

    implementation "io.coil-kt:coil-compose:2.7.0"

    // Retrofit for API calls
    implementation "com.squareup.retrofit2:retrofit:2.9.0"
    implementation "com.squareup.retrofit2:converter-gson:2.9.0"
    implementation "com.squareup.okhttp3:logging-interceptor:4.9.3"
    implementation "com.squareup.okhttp3:okhttp:4.9.3"

    // Kotlin serialization
    implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:1.6.3"

    def camerax_version = "1.4.1"
    implementation "androidx.camera:camera-core:$camerax_version"
    implementation "androidx.camera:camera-camera2:$camerax_version"
    implementation "androidx.camera:camera-lifecycle:$camerax_version"
    implementation "androidx.camera:camera-view:$camerax_version"

    testImplementation "junit:junit:4.13.2"
    testImplementation "io.mockk:mockk:1.13.12"
    testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:1.9.0"
    androidTestImplementation "androidx.test.ext:junit:1.2.1"
    androidTestImplementation "androidx.test.espresso:espresso-core:3.6.1"
    androidTestImplementation "androidx.compose.ui:ui-test-junit4"
    debugImplementation "androidx.compose.ui:ui-test-manifest"
    // Provides the HttpLoggingInterceptor for Retrofit/OkHttp
    implementation("com.squareup.okhttp3:logging-interceptor:4.12.0")

    // Provides the @Inject and @Singleton annotations
    implementation("javax.inject:javax.inject:1")
}
